name: Build single HTML demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-single-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate standalone HTML
        run: node scripts/generate-standalone-demo.mjs

      - name: Verify standalone artifact
        run: |
          test -s artifact/timer-starter.html
          grep -F "id=\"primary-button\"" artifact/timer-starter.html
          grep -F "setInterval" artifact/timer-starter.html
          if grep -Eq '<script[^>]+src=|<link[^>]+rel=["'\''"]stylesheet' artifact/timer-starter.html; then
            echo "::error::Standalone artifact must not contain external JS or CSS."
            exit 1
          fi

      - name: Upload single HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: timer-starter-single-html
          path: artifact/timer-starter.html
          if-no-files-found: error
