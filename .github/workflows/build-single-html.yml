name: Build single HTML demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-single-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single HTML
        run: npm run build:single

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp dist/index.html artifact/timer-starter.html

      - name: Upload single HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: timer-starter-single-html
          path: artifact/timer-starter.html
          if-no-files-found: error
